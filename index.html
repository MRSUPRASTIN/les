<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сказка о волшебном лесе</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="trees trees-back"></div>
  <div class="trees trees-front"></div>
  <div class="fog"></div>

  <div class="page">
    <h1 class="title">Сказка о волшебном лесе</h1>
    <p class="subtitle">Зайди в дремучий лес — там живёт чудо…</p>

    <div class="ad-slot" data-ad-slot="top"></div>

    <div class="video-frame">
      <video id="forestVideo" controls playsinline preload="auto">
        <source src="Сказка о волшебном лесе.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
      </video>
    </div>

    <div class="ad-slot" data-ad-slot="afterVideo"></div>

    <div class="sparkle-note">✦ ✦ ✦</div>

    <section class="gallery-section">
      <h2 class="gallery-title">Картинки из леса</h2>
      <div class="gallery" id="gallery"></div>
      <div class="ad-slot" data-ad-slot="footer"></div>
    </section>
  </div>

  <div id="lightbox"></div>

  <canvas id="fireflies"></canvas>
  <div class="moon"></div>

  <script src="gallery.js"></script>
  <script src="ads.js"></script>
  <script src="script.js"></script>
</body>
</html>
